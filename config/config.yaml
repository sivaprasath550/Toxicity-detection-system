# Central config for the pipeline. Every script in src/ reads from here so
# hyperparameters, paths, and toggles live in one place and every run is
# reproducible from a single file + a seed.

seed: 42

paths:
  raw_train_csv: data/raw/train.csv
  raw_test_csv: data/raw/test.csv
  processed_dir: data/processed
  model_dir: models
  reports_dir: reports
  figures_dir: reports/figures

data:
  val_size: 0.05
  dev_subsample_size: 200000   # rows for the fast local iteration loop
  min_per_subgroup_dev: 500    # top-up floor per identity in the dev subsample
  toxic_threshold: 0.5
  identity_threshold: 0.5

# Which of the 9 scored identity columns + 6 aux subtype columns to use —
# kept here (not hardcoded) so an ablation can drop columns without code
# changes. Defaults mirror metrics.IDENTITY_COLUMNS / AUX_TOXICITY_COLUMNS.
identity_columns:
  - male
  - female
  - homosexual_gay_or_lesbian
  - christian
  - jewish
  - muslim
  - black
  - white
  - psychiatric_or_mental_illness

aux_columns:
  - severe_toxicity
  - obscene
  - threat
  - insult
  - identity_attack
  - sexual_explicit

baseline_tfidf:
  word_ngram_range: [1, 2]
  # word_max_features / char_max_features: unused now -- src/baseline.py
  # switched from a vocabulary-based TfidfVectorizer to
  # HashingVectorizer+TfidfTransformer (fixed n_features=2**20 in code),
  # since building an explicit vocabulary across 1.7M+ documents before
  # pruning to max_features caused a MemoryError on this 8GB-RAM dev
  # machine. Left here as a record of the original design, not read
  # anywhere.
  word_max_features: 30000
  char_ngram_range: [2, 4]   # trimmed from [2, 5] -- another RAM-driven
  # cut: char n-grams up to 5 over the full corpus (~1.7M docs, some up to
  # ~1000 chars) produce close to a billion (doc, feature) instances,
  # which alone doesn't fit in 8GB regardless of vectorizer choice. See
  # src/baseline.py's default stratified-subsample sizing for the other
  # half of this tradeoff.
  char_max_features: 30000
  C: 4.0

transformer:
  model_name: microsoft/deberta-v3-base
  max_len: 220
  batch_size: 32
  eval_batch_size: 64
  lr: 2.0e-5
  warmup_ratio: 0.05
  epochs: 2
  weight_decay: 0.01
  fp16: true
  aux_loss_weight: 0.25       # weight on the 6 aux-subtype BCE heads
  use_multitask_heads: true   # ablation toggle
  weighting_scheme: metric_derived   # none | inverse_frequency | metric_derived
  grad_accum_steps: 1
  max_grad_norm: 1.0
  log_every: 100
  checkpoint_every_steps: 2000

thresholds:
  # Deployment operating points swept on the held-out val split.
  auto_action_precision: 0.95
  human_review_precision: 0.60

calibration:
  n_bins: 10   # for the reliability diagram / ECE

bias_probe:
  n_templates: 20
  identities:
    - gay
    - lesbian
    - muslim
    - jewish
    - christian
    - black
    - white
    - female
    - male
    - mentally ill
